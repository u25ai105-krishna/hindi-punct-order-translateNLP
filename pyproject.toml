[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-punct-order-translate"
version = "0.1.0"
description = "Reproducible Hindi Punctuation Restoration, Sentence Ordering, and Translation Pipeline"
authors = [{name = "Senior NLP Engineer"}]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "peft>=0.7.0",
    "sentence-transformers>=2.2.2",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']
